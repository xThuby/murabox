name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Only the newest commit on a branch is worth testing. Without this, a run of
# pushes queues up jobs faster than runners are handed out, and the ones at the
# back get cancelled without ever starting.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: smoke (${{ matrix.neovim }})
    runs-on: ubuntu-latest
    # The suite takes well under a minute; anything near this is a hang.
    timeout-minutes: 10
    # Nightly breaking is Neovim's business, not a reason to fail the build.
    continue-on-error: ${{ matrix.neovim == 'nightly' }}
    strategy:
      fail-fast: false
      matrix:
        neovim: [stable, nightly]

    steps:
      - uses: actions/checkout@v5

      - name: Install Neovim (${{ matrix.neovim }})
        run: |
          curl -fsSL -o nvim.tar.gz \
            "https://github.com/neovim/neovim/releases/download/${{ matrix.neovim }}/nvim-linux-x86_64.tar.gz"
          tar -xzf nvim.tar.gz
          echo "$PWD/nvim-linux-x86_64/bin" >> "$GITHUB_PATH"

      - name: Version
        run: nvim --version

      - name: Smoke test
        run: nvim --headless --clean -u NONE -l tests/smoke.lua
